x-app: &app
  image: book_store_app:latest
  environment:
    POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}

  networks:
    - book_store_network

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    networks:
      - book_store_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *app
    build: .
    command: sh -c 'yoyo apply --database "$$POSTGRES_URL" --batch'
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - 5001:5001
    pull_policy: never
    environment:
      FLAGSMITH_KEY: ${FLAGSMITH_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  book_store_network:
