{% extends 'base.html' %}

{% block title %}Books{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold">New book</h1>
{% for message in get_flashed_messages() %}
<p class="error">{{ message }}</p>
{% endfor %}

<form method="POST" action="/books/new" class="form">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" class="form-input"><br>

    <label for="author">Author</label>
    <input type="text" id="author" name="author" class="form-input"><br>

    <label for="synopsis">Synopsis</label>
    <input type="text" id="synopsis" name="synopsis" class="form-input"><br>

    <label for="rating">Rating (0.0 - 5.0):</label>
    <input type="number" id="rating" name="rating" min="0" max="5" step="0.1" placeholder="4.5" class="form-input">

    <label for="notes">Notes</label>
    <input type="text" id="notes" name="notes" class="form-input"><br>

    <input type="submit" value="Submit" class="btn-primary mt-2">
</form>
{% endblock %}
