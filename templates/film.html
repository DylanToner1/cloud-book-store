{% extends 'base.html' %}

{% block title %}{{ film.title }}{% endblock %}

{% block content %}


<div class="flex flex-col gap-6">
    <div class="flex flex-col">
        <p class="font-semibold text-4xl" data-testid="film-title">
            {{ film.title }}
        </p>
    </div>
    <div class="flex-col flex gap-2">
        <p class="p-2 bg-[#1a1a1f] w-fit rounded-lg" data-testid="film-release_date">
            Release Date: {{ film.release_date.isoformat() }}
        </p>
    </div>
</div>
{% endblock %}
