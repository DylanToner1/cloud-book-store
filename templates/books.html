{% extends 'base.html' %}

{% block title %}Books{% endblock %}

{% block content %}
<h1>My Books</h1>
    <a href="/">home</a>
    {% if books %}
        <ul>
            {% for book in books %}
                <li>{{ book.title }} by {{ book.author }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No books yet!</p>
    {% endif %}
{% endblock %}
